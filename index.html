<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amber & Oak — Menu</title>

  <!-- Google's model-viewer library: this powers the 3D + AR feature.
       It only loads when a dish actually uses a 3D model, so photo/video dishes stay fast. -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

  <style>
    /* ============================================================
       THEME — change these two colors to re-skin the whole menu
       ============================================================ */
    :root {
      --ink: #2a211c;          /* main text */
      --ink-soft: #7a6a5f;     /* secondary text */
      --paper: #f7f2ec;        /* page background */
      --card: #fffdfa;         /* card background */
      --accent: #b06a3a;       /* price / buttons / highlights */
      --line: #e7ddd2;         /* borders */
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Header ---------- */
    header {
      text-align: center;
      padding: 40px 20px 28px;
      border-bottom: 1px solid var(--line);
    }
    header .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.1rem;
      letter-spacing: 0.5px;
    }
    header .tagline {
      color: var(--ink-soft);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    /* ---------- Category tabs ---------- */
    nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--paper);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      -webkit-overflow-scrolling: touch;
    }
    nav button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink-soft);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    nav button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* ---------- Menu grid ---------- */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }
    .category-title {
      font-family: Georgia, serif;
      font-size: 1.4rem;
      margin: 28px 6px 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    /* ---------- Dish card ---------- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .media {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #efe6db;
      position: relative;
    }
    .media img,
    .media video,
    .media model-viewer {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 0.7rem;
      padding: 4px 9px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }
    .card-body { padding: 14px 16px 16px; }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }
    .dish-name { font-size: 1.05rem; font-weight: 600; }
    .price { color: var(--accent); font-weight: 700; white-space: nowrap; }
    .desc { color: var(--ink-soft); font-size: 0.88rem; margin-top: 6px; }
    .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      font-size: 0.72rem;
      color: var(--ink-soft);
      border: 1px solid var(--line);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .ar-btn {
      margin-top: 12px;
      display: inline-block;
      text-align: center;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
    }

    footer {
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.8rem;
      padding: 30px 16px 40px;
      border-top: 1px solid var(--line);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo">Amber &amp; Oak</div>
    <div class="tagline">Coffee house &amp; kitchen — scan, browse, enjoy</div>
  </header>

  <nav id="tabs"><!-- category tabs are generated automatically --></nav>

  <main id="menu"><!-- menu is generated automatically from the data below --></main>

  <footer>
    Amber &amp; Oak · Open 8am–10pm · Tap any dish to view it larger
  </footer>

  <script>
    /* ============================================================
       YOUR MENU DATA — this is the ONLY part you edit per cafe.
       Each dish supports ONE of these media types:
         type: "photo"  -> src: "images/xxx.jpg"
         type: "video"  -> src: "videos/xxx.mp4"
         type: "3d"     -> src: "models/xxx.glb"
       Put your files in folders named images / videos / models.
       Swap a sample file for a real one later — keep the same
       filename and the QR code never changes.
       ============================================================ */
    const MENU = [
      {
        category: "Coffee",
        items: [
          { name: "Flat White", price: "$4.50", type: "photo",
            src: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=600&q=70",
            desc: "Double ristretto, silky steamed milk.", tags: ["Bestseller"] },
          { name: "Iced Caramel Latte", price: "$5.20", type: "photo",
            src: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=600&q=70",
            desc: "Espresso, caramel, cold milk over ice.", tags: ["Cold"] },
        ]
      },
      {
        category: "Bakery",
        items: [
          { name: "Butter Croissant", price: "$3.80", type: "photo",
            src: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600&q=70",
            desc: "24-layer, baked fresh each morning.", tags: ["Vegetarian"] },
          { name: "Chocolate Muffin", price: "$3.50", type: "photo",
            src: "https://images.unsplash.com/photo-1607958996333-41aef7caefaa?w=600&q=70",
            desc: "Rich cocoa sponge, dark chocolate chunks.", tags: [] },
        ]
      },
      {
        category: "Mains",
        items: [
          { name: "Smashed Avo Toast", price: "$9.50", type: "photo",
            src: "https://images.unsplash.com/photo-1588137378633-dea1336ce1e2?w=600&q=70",
            desc: "Sourdough, chilli, feta, poached egg.", tags: ["Vegetarian"] },
          /* Example of a 3D dish. Replace src with your own .glb file:
          { name: "Classic Burger", price: "$12.00", type: "3d",
            src: "models/burger.glb",
            desc: "Beef patty, cheddar, house sauce.", tags: ["View in 3D"] },
          */
          /* Example of a video dish:
          { name: "Signature Pancakes", price: "$10.00", type: "video",
            src: "videos/pancakes.mp4",
            desc: "Maple syrup poured tableside.", tags: ["New"] },
          */
        ]
      }
    ];

    /* ============================================================
       ENGINE — you don't need to touch anything below this line.
       ============================================================ */
    function mediaHTML(item) {
      if (item.type === "3d") {
        return `
          <model-viewer src="${item.src}" camera-controls auto-rotate
            ar ar-modes="webxr scene-viewer quick-look"
            shadow-intensity="1" alt="${item.name}">
            <button slot="ar-button" class="badge" style="top:auto;bottom:10px;left:10px;">View in AR</button>
          </model-viewer>`;
      }
      if (item.type === "video") {
        return `<video src="${item.src}" autoplay muted loop playsinline></video>`;
      }
      return `<img src="${item.src}" alt="${item.name}" loading="lazy" />`;
    }

    function cardHTML(item) {
      const badge = item.type === "3d" ? `<span class="badge">3D</span>`
                  : item.type === "video" ? `<span class="badge">Video</span>` : "";
      const tags = (item.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
      return `
        <article class="card">
          <div class="media">${badge}${mediaHTML(item)}</div>
          <div class="card-body">
            <div class="card-head">
              <span class="dish-name">${item.name}</span>
              <span class="price">${item.price}</span>
            </div>
            ${item.desc ? `<p class="desc">${item.desc}</p>` : ""}
            ${tags ? `<div class="tags">${tags}</div>` : ""}
          </div>
        </article>`;
    }

    const menuEl = document.getElementById("menu");
    const tabsEl = document.getElementById("tabs");

    MENU.forEach((cat, i) => {
      const section = document.createElement("section");
      section.dataset.cat = cat.category;
      section.innerHTML = `<h2 class="category-title">${cat.category}</h2>
        <div class="grid">${cat.items.map(cardHTML).join("")}</div>`;
      menuEl.appendChild(section);

      const btn = document.createElement("button");
      btn.textContent = cat.category;
      if (i === 0) btn.classList.add("active");
      btn.onclick = () => {
        section.scrollIntoView({ behavior: "smooth", block: "start" });
        document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      };
      tabsEl.appendChild(btn);
    });
  </script>
</body>
</html>
